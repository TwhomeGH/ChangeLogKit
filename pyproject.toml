[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "changelogkit"
version = "0.5.0"
description = "本機變更歷史 GUI 與開發索引：解析 ChangeHistory.md、唯讀索引 Git／文件／API 宣告"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TwhomeGH" }]
keywords = ["changelog", "documentation", "docc", "git", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Version Control :: Git",
]
# tomllib 是 Python 3.11+ 的標準庫；3.10 需要 tomli 讀 .changelog.toml。
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.scripts]
changelogkit = "changelogkit.cli:main"

[project.urls]
Homepage = "https://github.com/TwhomeGH/ChangeLogKit"
Repository = "https://github.com/TwhomeGH/ChangeLogKit"
Issues = "https://github.com/TwhomeGH/ChangeLogKit/issues"
Documentation = "https://github.com/TwhomeGH/ChangeLogKit/tree/main/Docs"

# 建置掛鉤：打包時產生 src/changelogkit/_buildinfo.py（見 hatch_build.py）。
[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/changelogkit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md"]
