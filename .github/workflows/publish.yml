# 發佈到 PyPI：打 v* tag（或建立 GitHub Release）時觸發。
#
# 採 PyPI Trusted Publishing（OIDC），不需要 API token：
# 先在 PyPI 專案頁設定 Trusted Publisher
#   Owner=TwhomeGH  Repository=ChangeLogKit  Workflow=publish.yml  Environment=pypi
# 之後這裡以 id-token 換取短效權杖發佈。
name: publish

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

jobs:
  pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write   # 必要：Trusted Publishing（OIDC）
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/check_version.py --tag "${{ github.ref_name }}"
      - name: Build distributions
        run: |
          python -m pip install -U build
          # 分開建置：兩者都直接從「原始碼」建，wheel 才讀得到 git（蓋章來源 commit）。
          # （`python -m build` 預設會從 sdist 再建 wheel，那裡沒有 git。）
          python -m build --sdist
          python -m build --wheel
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
