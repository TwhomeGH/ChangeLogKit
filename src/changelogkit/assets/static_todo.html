<!doctype html>
<html lang="{{lang_html}}"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{project}} · {{t.todo.title}}</title>
<meta name="generator" content="changelogkit">
<script src="{{base}}assets/theme.js"></script>
<script>window.CK_LOCALES = {{CK_LOCALES}}; window.CK_LOCALE = "{{CK_LOCALE}}";</script>
<script src="{{base}}assets/i18n.js"></script>
<script src="{{base}}assets/highlight.js"></script>
<script src="{{base}}assets/markdown.js"></script>
<link rel="stylesheet" href="{{base}}assets/theme.css">
<link rel="stylesheet" href="{{base}}assets/dev.css">
</head><body>
<header class="appbar">
  <h1 data-i18n="todo.title">{{t.todo.title}}</h1>
  <a href="{{base}}" data-i18n="nav.history">{{t.nav.history}}</a>
  <a href="{{base}}development/" data-i18n="nav.dev">{{t.nav.dev}}</a>
  <a href="{{base}}about/" data-i18n="nav.about">{{t.nav.about}}</a>
  <a href="{{base}}development/todo.html" class="active" data-i18n="nav.todo">{{t.nav.todo}}</a>
  <span class="spacer"></span>
  <details class="todo-index-wrap" id="todo-index-wrap">
    <summary><span data-i18n="todo.sections">{{t.todo.sections}}</span> (<span id="todo-index-count">{{sections}}</span>)</summary>
    <nav id="todo-index" class="todo-index" aria-label="{{t.todo.sections}}" data-i18n-aria="todo.sections"></nav>
  </details>
  <button id="locale" type="button">🌐</button>
  <button id="theme" aria-label="{{t.btn.theme}}" data-i18n-aria="btn.theme" title="{{t.btn.theme}}" data-i18n-title="btn.theme">🌙</button>
</header>
<main class="todo-main">
  <section class="card todo-head">
    <div class="todo-progress" aria-hidden="true"><span style="width: {{pct}}%"></span></div>
    <div class="todo-meta">
      <span data-i18n="todo.done">{{t.todo.done}}</span> {{done}} / {{total}}
      · <a href="{{source_url}}" data-i18n="todo.source">{{t.todo.source}}</a>
    </div>
  </section>
  <div class="todo-tools">
    <input id="todo-search" type="search" placeholder="{{t.todo.search}}"
           data-i18n-ph="todo.search" aria-label="{{t.todo.search}}" data-i18n-aria="todo.search">
    <button type="button" class="chip on" data-filter="all"><span data-i18n="todo.all">{{t.todo.all}}</span> ({{total}})</button>
    <button type="button" class="chip" data-filter="open"><span data-i18n="todo.open">{{t.todo.open}}</span> ({{open_count}})</button>
    <button type="button" class="chip" data-filter="done"><span data-i18n="todo.done">{{t.todo.done}}</span> ({{done}})</button>
  </div>
  <div id="todo-content">{{content}}</div>
  <p id="todo-empty" class="empty" data-i18n="todo.empty" hidden></p>
</main>
<script>
const todoContent = document.getElementById("todo-content");
const todoSearch = document.getElementById("todo-search");
const todoEmpty = document.getElementById("todo-empty");
const todoButtons = [...document.querySelectorAll("[data-filter]")];
let todoFilter = "all";

function hydrateLabels(scope) {
  for (const el of scope.querySelectorAll(".todo-item .label[data-raw]")) {
    el.innerHTML = window.renderInline(el.getAttribute("data-raw"));
  }
}

function renderIndex() {
  const nav = document.getElementById("todo-index");
  nav.innerHTML = "";
  for (const section of todoContent.querySelectorAll(".todo-section")) {
    const heading = section.querySelector("h2");
    if (!heading || !section.id) continue;
    const link = document.createElement("a");
    link.href = "#" + section.id;
    link.innerHTML = heading.innerHTML;
    nav.appendChild(link);
  }
  document.getElementById("todo-index-count").textContent = nav.children.length;
  markActiveIndex();
}

function markActiveIndex() {
  const links = [...document.querySelectorAll("#todo-index a")];
  if (!links.length) return;
  let current = "";
  for (const section of todoContent.querySelectorAll(".todo-section")) {
    if (section.hidden) continue;
    if (section.getBoundingClientRect().top <= 130) current = section.id;
    else break;
  }
  links.forEach((link) => {
    const on = link.getAttribute("href") === "#" + current;
    link.classList.toggle("on", on);
    if (on) link.setAttribute("aria-current", "location");
    else link.removeAttribute("aria-current");
  });
}

function applyTodoFilter() {
  const items = [...todoContent.querySelectorAll(".todo-item")];
  const sections = [...todoContent.querySelectorAll(".todo-section")];
  const q = todoSearch.value.trim().toLowerCase();
  let visible = 0;
  for (const item of items) {
    const done = item.dataset.done === "true";
    const hit = (todoFilter === "all" || (todoFilter === "open" ? !done : done))
      && (!q || item.textContent.toLowerCase().includes(q));
    item.hidden = !hit;
    if (hit) visible++;
  }
  for (const section of sections) {
    section.hidden = ![...section.querySelectorAll(".todo-item")].some((item) => !item.hidden);
  }
  const visibleIds = new Set(sections.filter((section) => !section.hidden).map((section) => section.id));
  document.querySelectorAll("#todo-index a").forEach((link) => {
    link.hidden = !visibleIds.has(link.getAttribute("href").slice(1));
  });
  document.getElementById("todo-index-count").textContent = visibleIds.size;
  todoEmpty.hidden = visible !== 0;
  markActiveIndex();
}

todoButtons.forEach((button) => button.addEventListener("click", () => {
  todoFilter = button.dataset.filter;
  todoButtons.forEach((other) => other.classList.toggle("on", other === button));
  applyTodoFilter();
}));
todoSearch.addEventListener("input", applyTodoFilter);
document.getElementById("todo-index").addEventListener("click", (event) => {
  if (event.target.closest("a")) document.getElementById("todo-index-wrap").open = false;
});
document.addEventListener("click", (event) => {
  const wrap = document.getElementById("todo-index-wrap");
  if (wrap && wrap.open && !wrap.contains(event.target)) wrap.open = false;
});
window.addEventListener("scroll", markActiveIndex, { passive: true });

hydrateLabels(todoContent);
renderIndex();
applyTodoFilter();
</script>
<footer class="built">{{footer}}</footer>
</body></html>
