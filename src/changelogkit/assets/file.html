<!doctype html>
<html lang="{{lang_html}}"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}} — {{t.dev.title}}</title>
<script src="/assets/theme.js"></script>
<script>window.CK_LOCALES = {{CK_LOCALES}}; window.CK_LOCALE = "{{CK_LOCALE}}";</script>
<script src="/assets/i18n.js"></script>
<link rel="stylesheet" href="/assets/theme.css">
<link rel="stylesheet" href="/assets/file.css">
</head><body>
<header class="appbar">
  <a href="/development" id="back" data-i18n="file.back">{{t.file.back}}</a>
  <strong id="name">{{title}}</strong>
  <span class="muted">{{repo}}</span>
  <span class="spacer"></span>
  <button id="mode" hidden data-i18n="file.source">{{t.file.source}}</button>
  <input id="jump" type="number" min="1" placeholder="{{t.file.jump}}" data-i18n-ph="file.jump" aria-label="{{t.file.jump}}" data-i18n-aria="file.jump">
  <button id="copy" title="{{t.file.copy}}" data-i18n-title="file.copy" data-i18n="file.copy">{{t.file.copy}}</button>
  <button id="locale" type="button">🌐</button>
  <button id="theme" aria-label="{{t.btn.theme}}" data-i18n-aria="btn.theme" title="{{t.btn.theme}}" data-i18n-title="btn.theme">🌙</button>
</header>
<div class="wrap">
  <div class="doclayout" id="doclayout">
    <aside class="doctoc" id="doctoc" hidden>
      <div class="doctoc-head">
        <span data-i18n="file.toc">{{t.file.toc}}</span>
        <button type="button" class="doctoc-close" id="tocclose" aria-label="{{t.file.toc_close}}">×</button>
      </div>
      <nav id="toclist"></nav>
    </aside>
    <div class="docmain">
      <pre id="src" data-repo="{{repo}}" data-path="{{path}}" data-line="{{line}}">{{content}}</pre>
      <article id="rendered" class="rendered" hidden></article>
    </div>
  </div>
</div>
<button type="button" class="tocbtn" id="tocbtn" hidden aria-controls="doctoc" aria-expanded="false" data-i18n="file.toc">{{t.file.toc}}</button>
<script src="/assets/highlight.js"></script>
<script src="/assets/markdown.js"></script>
<script src="/assets/file.js"></script>
<script>document.addEventListener("ck-locale-change", () => location.reload());</script>
</body></html>
