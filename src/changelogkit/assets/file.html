<!doctype html>
<html lang="{{lang_html}}"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}} — {{t.dev.title}}</title>
<script src="/assets/theme.js"></script>
<script src="/assets/i18n.js"></script>
<script>window.CK_I18N = {{i18n_json}};</script>
<link rel="stylesheet" href="/assets/theme.css">
<link rel="stylesheet" href="/assets/file.css">
</head><body>
<header class="appbar">
  <a href="/development" id="back">{{t.file.back}}</a>
  <strong id="name">{{title}}</strong>
  <span class="muted">{{repo}}</span>
  <span class="spacer"></span>
  <button id="mode" hidden>{{t.file.source}}</button>
  <input id="jump" type="number" min="1" placeholder="{{t.file.jump}}" aria-label="{{t.file.jump}}">
  <button id="copy" title="{{t.file.copy}}">{{t.file.copy}}</button>
  <button id="theme" aria-label="{{t.btn.theme}}" title="{{t.btn.theme}}">🌙</button>
</header>
<div class="wrap">
  <pre id="src" data-repo="{{repo}}" data-path="{{path}}" data-line="{{line}}">{{content}}</pre>
  <article id="rendered" class="rendered" hidden></article>
</div>
<script src="/assets/highlight.js"></script>
<script src="/assets/markdown.js"></script>
<script src="/assets/file.js"></script>
</body></html>
