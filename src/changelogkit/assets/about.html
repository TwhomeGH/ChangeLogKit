<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>關於</title>
<script src="/assets/theme.js"></script>
<link rel="stylesheet" href="/assets/theme.css">
<style>
  main { max-width: 720px; margin: 0 auto; padding: 24px }
  .card dl { display: grid; grid-template-columns: 120px 1fr; gap: 8px 16px; margin: 10px 0 0 }
  .card dt { color: var(--mut); font-size: 13px }
  .card dd { margin: 0; overflow-wrap: anywhere }
  .card code { font-size: 13px }
</style>
</head><body>
<header class="appbar">
  <h1>關於</h1>
  <a href="/">變更歷史</a>
  <a href="/development">開發索引</a>
  <button id="theme" aria-label="切換深淺色" title="切換深/淺色">🌙</button>
</header>
<main>
  <article class="card">
    <h2>changelogkit</h2>
    <p class="muted">通用變更歷史與開發索引工具。</p>
    <dl>
      <dt>版本</dt><dd id="version">…</dd>
      <dt>來源 commit</dt><dd id="commit">…</dd>
      <dt>專案首頁</dt><dd><a href="https://github.com/TwhomeGH/ChangeLogKit">github.com/TwhomeGH/ChangeLogKit</a></dd>
    </dl>
  </article>
</main>
<script src="/assets/about.js"></script>
</body></html>
