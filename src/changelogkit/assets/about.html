<!doctype html>
<html lang="{{lang_html}}"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="about.title">{{t.about.title}}</title>
<script src="/assets/theme.js"></script>
<script>window.CK_LOCALES = {{CK_LOCALES}}; window.CK_LOCALE = "{{CK_LOCALE}}";</script>
<script src="/assets/i18n.js"></script>
<link rel="stylesheet" href="/assets/theme.css">
<style>
  main { max-width: 720px; margin: 0 auto; padding: 24px }
  .card dl { display: grid; grid-template-columns: 120px 1fr; gap: 8px 16px; margin: 10px 0 0 }
  .card dt { color: var(--mut); font-size: 13px }
  .card dd { margin: 0; overflow-wrap: anywhere }
  .card code { font-size: 13px }
</style>
</head><body>
<header class="appbar">
  <h1 data-i18n="about.title">{{t.about.title}}</h1>
  <a href="/" data-i18n="nav.history">{{t.nav.history}}</a>
  <a href="/development" data-i18n="nav.dev">{{t.nav.dev}}</a>
  <button id="locale" type="button">🌐</button>
  <button id="theme" aria-label="{{t.btn.theme}}" data-i18n-aria="btn.theme" title="{{t.btn.theme}}" data-i18n-title="btn.theme">🌙</button>
</header>
<main>
  <article class="card">
    <h2>changelogkit</h2>
    <p class="muted" data-i18n="about.intro">{{t.about.intro}}</p>
    <dl>
      <dt data-i18n="about.version">{{t.about.version}}</dt><dd id="version">…</dd>
      <dt data-i18n="about.commit">{{t.about.commit}}</dt><dd id="commit">…</dd>
      <dt data-i18n="about.locales">{{t.about.locales}}</dt><dd id="locales">…</dd>
      <dt data-i18n="about.home">{{t.about.home}}</dt><dd><a href="https://github.com/TwhomeGH/ChangeLogKit">github.com/TwhomeGH/ChangeLogKit</a></dd>
    </dl>
  </article>
</main>
<script src="/assets/about.js"></script>
<script>document.addEventListener("ck-locale-change", () => location.reload());</script>
</body></html>
