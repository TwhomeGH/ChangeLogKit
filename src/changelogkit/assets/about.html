<!doctype html>
<html lang="{{lang_html}}"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{t.about.title}}</title>
<script src="/assets/theme.js"></script>
<script src="/assets/i18n.js"></script>
<script>window.CK_I18N = {{i18n_json}};</script>
<link rel="stylesheet" href="/assets/theme.css">
<style>
  main { max-width: 720px; margin: 0 auto; padding: 24px }
  .card dl { display: grid; grid-template-columns: 120px 1fr; gap: 8px 16px; margin: 10px 0 0 }
  .card dt { color: var(--mut); font-size: 13px }
  .card dd { margin: 0; overflow-wrap: anywhere }
  .card code { font-size: 13px }
</style>
</head><body>
<header class="appbar">
  <h1>{{t.about.title}}</h1>
  <a href="/">{{t.nav.history}}</a>
  <a href="/development">{{t.nav.dev}}</a>
  <button id="theme" aria-label="{{t.btn.theme}}" title="{{t.btn.theme}}">🌙</button>
</header>
<main>
  <article class="card">
    <h2>changelogkit</h2>
    <p class="muted">{{t.about.intro}}</p>
    <dl>
      <dt>{{t.about.version}}</dt><dd id="version">…</dd>
      <dt>{{t.about.commit}}</dt><dd id="commit">…</dd>
      <dt>{{t.about.home}}</dt><dd><a href="https://github.com/TwhomeGH/ChangeLogKit">github.com/TwhomeGH/ChangeLogKit</a></dd>
    </dl>
  </article>
</main>
<script src="/assets/about.js"></script>
</body></html>
