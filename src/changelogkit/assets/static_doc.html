<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{docname}} · {{title}}</title>
<meta name="generator" content="changelogkit">
<script src="../assets/theme.js"></script>
<script src="../assets/highlight.js"></script>
<script src="../assets/markdown.js"></script>
<link rel="stylesheet" href="../assets/theme.css">
<link rel="stylesheet" href="../assets/file.css">
</head><body>
<header class="appbar">
  <h1>{{docname}}</h1>
  <a href="../development/">開發索引</a>
  <a href="../">變更歷史</a>
  <span class="spacer"></span>
  <button id="theme" aria-label="切換深淺色" title="切換深/淺色">🌙</button>
</header>
<main>
  <div class="rendered" data-md><template>{{content}}</template></div>
</main>
<script>
for (const el of document.querySelectorAll("[data-md]")) {
  const tpl = el.querySelector("template");
  if (tpl) el.innerHTML = window.renderMarkdown(tpl.content.textContent);
}
</script>
<footer class="built">{{footer}}</footer>
</body></html>
