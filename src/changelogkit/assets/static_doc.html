<!doctype html>
<html lang="{{lang_html}}"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{docname}} · {{title}}</title>
<meta name="generator" content="changelogkit">
<script src="../assets/theme.js"></script>
<script>window.CK_LOCALES = {{CK_LOCALES}}; window.CK_LOCALE = "{{CK_LOCALE}}";</script>
<script>window.CK_SITE_BASE = {{site_base}}; window.CK_DOC_PAGES = {{doc_pages}}; window.CK_BLOB_BASE = {{blob_base}}; window.CK_DOC_PATH = {{doc_path}};</script>
<script src="../assets/i18n.js"></script>
<script src="../assets/highlight.js"></script>
<script src="../assets/markdown.js"></script>
<link rel="stylesheet" href="../assets/theme.css">
<link rel="stylesheet" href="../assets/file.css">
</head><body>
<header class="appbar">
  <h1>{{docname}}</h1>
  <a href="../development/" data-i18n="nav.dev">{{t.nav.dev}}</a>
  <a href="../" data-i18n="nav.history">{{t.nav.history}}</a>
  <a href="../about/" data-i18n="nav.about">{{t.nav.about}}</a>
  <span class="spacer"></span>
  <button id="locale" type="button">🌐</button>
  <button id="theme" aria-label="{{t.btn.theme}}" data-i18n-aria="btn.theme" title="{{t.btn.theme}}" data-i18n-title="btn.theme">🌙</button>
</header>
<main>
  <div class="rendered" data-md><template>{{content}}</template></div>
</main>
<script>
const resolve = window.markdownStaticResolver(window.CK_DOC_PATH);
for (const el of document.querySelectorAll("[data-md]")) {
  const tpl = el.querySelector("template");
  if (tpl) el.innerHTML = window.renderMarkdown(tpl.content.textContent, resolve);
}
</script>
<footer class="built">{{footer}}</footer>
</body></html>
