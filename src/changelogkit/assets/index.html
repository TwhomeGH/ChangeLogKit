<!doctype html>
<html lang="{{lang_html}}"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{t.nav.history}}</title>
<script src="/assets/theme.js"></script>
<script src="/assets/i18n.js"></script>
<script>window.CK_I18N = {{i18n_json}};</script>
<link rel="stylesheet" href="/assets/theme.css">
<link rel="stylesheet" href="/assets/index.css">
</head><body>
<header class="appbar">
  <h1>{{t.nav.history}}</h1>
  <a href="/development">{{t.history.dev_link}}</a>
  <a href="/about">{{t.nav.about}}</a>
  <input id="q" aria-label="{{t.history.search}}" placeholder="{{t.history.search}}">
  <select id="type" aria-label="{{t.history.filter_all}}">
    <option value="">{{t.history.filter_all}}</option><option>修復</option><option>新增</option>
    <option>優化</option><option>重構</option><option>測試</option>
  </select>
  <button id="reload" aria-label="{{t.history.reload}}" title="{{t.history.reload}}">↻</button>
  <button id="theme" aria-label="{{t.btn.theme}}" title="{{t.btn.theme}}">🌙</button>
  <button id="add" class="primary">{{t.history.add}}</button>
</header>
<main>
  <aside id="list"></aside>
  <section id="detail"><div class="empty">{{t.history.empty_select}}</div></section>
</main>

<div id="modal" hidden><div class="dialog">
  <h2>{{t.form.modal_title}}</h2>
  <label for="f-title">{{t.form.title}}</label><input id="f-title" placeholder="{{t.form.title_ph}}">
  <div class="row">
    <div><label for="f-date">{{t.form.date}}</label><input id="f-date" placeholder="YYYY.MM.DD"></div>
    <div><label for="f-time">{{t.form.time}}</label><input id="f-time" placeholder="HH:MM"></div>
    <div><label for="f-type">{{t.form.type}}</label>
      <select id="f-type"><option>修復</option><option>新增</option><option>優化</option><option>重構</option><option>測試</option></select>
    </div>
  </div>
  <label for="f-file">{{t.form.file}}</label><input id="f-file" placeholder="path/to/file" list="gitfiles">
  <datalist id="gitfiles"></datalist>
  <div class="chips" id="chips"></div>
  <label for="f-problem">{{t.form.problem}}</label><textarea id="f-problem" placeholder="{{t.form.problem_ph}}"></textarea>
  <label for="f-cause">{{t.form.cause}}</label><textarea id="f-cause" placeholder="{{t.form.cause_ph}}"></textarea>
  <label for="f-changes">{{t.form.changes}}</label><textarea id="f-changes" placeholder="{{t.form.changes_ph}}"></textarea>
  <label>{{t.form.refs}}</label>
  <div id="refs"></div>
  <button type="button" id="add-ref">{{t.form.add_ref}}</button>
  <div class="foot">
    <div id="form-err" class="err"></div>
    <div class="right"><button id="cancel">{{t.form.cancel}}</button><button id="submit" class="primary">{{t.form.insert}}</button></div>
  </div>
</div></div>

<script src="/assets/index.js"></script>
</body></html>
