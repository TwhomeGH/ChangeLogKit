<!doctype html>
<html lang="{{lang_html}}"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<meta name="generator" content="changelogkit">
<script src="assets/theme.js"></script>
<script>window.CK_LOCALES = {{CK_LOCALES}}; window.CK_LOCALE = "{{CK_LOCALE}}";</script>
<script>window.CK_SITE_BASE = {{site_base}}; window.CK_DOC_PAGES = {{doc_pages}}; window.CK_BLOB_BASE = {{blob_base}}; window.CK_DOC_PATH = {{doc_path}};</script>
<script src="assets/i18n.js"></script>
<script src="assets/highlight.js"></script>
<script src="assets/markdown.js"></script>
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/file.css">
<style>
  /* 靜態首頁版面：置中、留邊，卡片間距一致。 */
  main { max-width: 960px; margin: 0 auto; padding: 22px 24px 64px }
  #hint { margin: 4px 0 12px }
  #entries { display: flex; flex-direction: column; gap: 14px }
  #entries .card { margin: 0 }
  .card h2 { margin: 0 0 6px; font-size: 19px; line-height: 1.35 }
  .card .meta { color: var(--mut); font-size: 12.5px; margin-bottom: 10px }
  .card .rendered { max-width: none; margin: 0; padding: 0 }
  .card .rendered > :first-child { margin-top: 0 }
  .card .rendered > :last-child { margin-bottom: 0 }
</style>
</head><body>
<header class="appbar">
  <h1>{{title}}</h1>
  <a href="development/" data-i18n="nav.dev">{{t.nav.dev}}</a>
  <a href="development/#docs" data-i18n="nav.docs">{{t.nav.docs}}</a>
  <a href="about/" data-i18n="nav.about">{{t.nav.about}}</a>
  <span class="spacer"></span>
  <button id="locale" type="button">🌐</button>
  <button id="theme" aria-label="{{t.btn.theme}}" data-i18n-aria="btn.theme" title="{{t.btn.theme}}" data-i18n-title="btn.theme">🌙</button>
</header>
<main>
  <p class="muted" id="hint" data-i18n="static.export_hint">{{t.static.export_hint}}</p>
  <section id="entries">
{{content}}
  </section>
</main>
<script>
/* 以 markdown.js 就地渲染每筆紀錄（唯讀）；相對連結依來源文件路徑改寫。 */
const histResolve = window.markdownStaticResolver(window.CK_DOC_PATH);
for (const el of document.querySelectorAll("[data-md]")) {
  const tpl = el.querySelector("template");
  if (tpl) el.innerHTML = window.renderMarkdown(tpl.content.textContent, histResolve);
}
</script>
<footer class="built">{{footer}}</footer>
</body></html>
