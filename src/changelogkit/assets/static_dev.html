<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>開發索引 · {{title}}</title>
<meta name="generator" content="changelogkit">
<script src="../assets/theme.js"></script>
<script src="../assets/highlight.js"></script>
<script src="../assets/markdown.js"></script>
<link rel="stylesheet" href="../assets/theme.css">
<link rel="stylesheet" href="../assets/dev.css">
</head><body>
<header class="appbar">
  <h1>開發索引</h1>
  <a href="../">變更歷史</a>
  <span class="spacer"></span>
  <button id="theme" aria-label="切換深淺色" title="切換深/淺色">🌙</button>
</header>
<main>
  <p class="muted">changelogkit 靜態匯出（唯讀）：符號 {{symbols}}、文件 {{documents}}、來源 {{sources}}。</p>
{{content}}
</main>
<script>
for (const el of document.querySelectorAll("[data-md]")) {
  const tpl = el.querySelector("template");
  if (tpl) el.innerHTML = window.renderMarkdown(tpl.content.textContent);
}
/* diff 內文（+／-／context）以 highlight.js 就地語法上色；行首符號另以 dmark 呈現。 */
for (const el of document.querySelectorAll(".dline[data-line]")) {
  const raw = el.getAttribute("data-line");
  const mark = raw[0] || " ";
  el.innerHTML = '<span class="dmark">' + window.HL.esc(mark) + "</span>" +
    window.HL.swift(raw.slice(1), { block: false });
}
</script>
<footer class="built">{{footer}}</footer>
</body></html>
